services:
  # Backend Service
  - type: web
    name: audiomix-backend
    env: python
    region: frankfurt
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn server:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /api/
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: MONGO_URL
        sync: false
      - key: DB_NAME
        value: audiomix_producciones
      - key: CORS_ORIGINS
        sync: false

  # Frontend Service  
  - type: web
    name: audiomix-frontend
    env: node
    region: frankfurt
    plan: free
    buildCommand: "cd frontend && yarn install && yarn build"
    staticPublishPath: ./frontend/build
    envVars:
      - key: NODE_VERSION
        value: 18.17.0
      - key: REACT_APP_BACKEND_URL
        fromService:
          type: web
          name: audiomix-backend
          envVarKey: RENDER_EXTERNAL_URL
